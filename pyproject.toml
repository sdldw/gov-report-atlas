[project]
name = "gov-report-atlas"
version = "0.1.0"
description = "Diffusion and translation of policy concepts across Chinese government work reports"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "lxml>=5.0",
  "pymupdf>=1.24",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "pypinyin>=0.51"]
render = ["playwright>=1.44", "selenium>=4.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

# 显式固定规则集：ruff 的默认集随版本变化，不写死会出现
# "同一份代码昨天绿、今天红"。这里只保留最稳定的一组。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
