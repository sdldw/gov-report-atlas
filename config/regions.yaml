# 样本框定义（最终版）
#
# 这里记录的是**实际执行**的样本，不是最初设想。
#
# 最初设计为「中央—省—市」三级、约 1,400 份。市级门户与 17 个省级门户的报告
# 栏目为 JavaScript 动态渲染，三轮探测（静态抓取、搜索引擎、无头浏览器）后判定
# 在课题周期内不可行，最终锁定省级面板。判定过程与证据见 docs/report.md 7.2 与
# data/probe/ 下的探测结果。

as_of: "2026-11-15"

years:
  from: 2015
  to: 2026

scope:
  level: province            # 仅省级行政区
  provinces: 18              # 实际取得数据的省份
  documents: 150             # 政府工作报告份数
  central_reports: 3         # 2024—2026 国务院政府工作报告，用于第 5 节复制率对照
  balanced_panel: "8 省 × 12 年 = 96 份"   # 趋势分析所用子样本

excluded:
  - "17 个省级门户：报告栏目动态渲染，文章路径多已失效"
  - "333 个地级行政区：入口各异，逐省适配成本高于课题周期可承受范围"
  - "港澳台：不在样本框内"

files:
  frame: "data/regions.csv"          # 全量样本框（364 个行政单元），供探索脚本使用
  manifest: "data/manifest.csv"      # 唯一事实来源：每份文档的来源 URL 与 SHA256
  central: "data/raw/central/"       # 中央报告（不随仓库分发）

seed: "data/regions_seed.csv"
extra: "data/prefectures_raw.csv"
